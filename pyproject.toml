[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ices-v2"
version = "2.0.0"
description = "Islamic Civilizational Economic Simulator v2"
readme = "README.md"
authors = [
    {name = "Marc Gilbert Daghar", email = "marc.daghar@example.com"}
]
license = {text = "CC0 1.0 (code) / CC BY-SA 4.0 (research)"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: CC0 1.0 Universal",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Complexity Science",
]
dependencies = [
    "mesa>=2.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "pymc>=5.0.0",
    "arviz>=0.15.0",
    "scikit-learn>=1.2.0",
    "plotly>=5.14.0",
    "streamlit>=1.25.0",
]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
